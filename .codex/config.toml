# Project-scoped Codex integration for the local LLM Wiki desktop app.
# Codex loads this file only after the repository is trusted.

[mcp_servers.llm_wiki]
command = "node"
args = ["mcp-server/dist/src/index.js"]
env_vars = ["LLM_WIKI_API_TOKEN"]
enabled = true
required = false
startup_timeout_sec = 20
tool_timeout_sec = 180
default_tools_approval_mode = "approve"

# Deliberately read-oriented. Source rescan remains available in the server but
# is omitted here because it changes project state and must be explicitly opted in.
enabled_tools = [
  "llm_wiki_status",
  "llm_wiki_projects",
  "llm_wiki_set_project",
  "llm_wiki_files",
  "llm_wiki_read_file",
  "llm_wiki_reviews",
  "llm_wiki_search",
  "llm_wiki_chat",
  "llm_wiki_graph",
]

# Chat can spend provider credits, so keep it user-gated even though the local
# read and project-selection tools above may run without an extra prompt.
[mcp_servers.llm_wiki.tools.llm_wiki_chat]
approval_mode = "prompt"

# Optional external repository orientation. Keep disabled for ordinary work;
# enable it only while a separately managed OpenDeepWiki service is running.
[mcp_servers.opendeepwiki]
url = "http://127.0.0.1:8080/api/mcp"
enabled = false
required = false
startup_timeout_sec = 10
tool_timeout_sec = 180
default_tools_approval_mode = "prompt"
